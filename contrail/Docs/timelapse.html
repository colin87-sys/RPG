<!doctype html><meta charset="utf-8"><title>CONTRAIL timelapse</title><style>
body{margin:0;background:#071C24;color:#75E845;font:14px ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;height:100vh}
#v{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}#v img{max-width:100%;max-height:100%}
nav{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:2px solid #2CA72F}
button{background:#11181D;color:#E4F4E0;border:1px solid #2CA72F;font:inherit;padding:4px 10px}input[type=range]{flex:1}#c{color:#E4F4E0}
</style><div id="v"><img id="i" alt=""></div><nav><button id="p">pause</button><input id="r" type="range" min="0" value="0"><span id="n"></span><span id="c"></span></nav>
<script>const F=[{"src":"progress/general/20260930T054134Z_hero.png","cap":"Docs/progress/general/20260930T054134Z_hero.png"}];let k=0,on=true;const i=document.getElementById('i'),r=document.getElementById('r'),n=document.getElementById('n'),c=document.getElementById('c');r.max=F.length-1;
function show(j){k=(j+F.length)%F.length;i.src=F[k].src;r.value=k;n.textContent=(k+1)+'/'+F.length;c.textContent=F[k].cap}
document.getElementById('p').onclick=e=>{on=!on;e.target.textContent=on?'pause':'play'};r.oninput=()=>show(+r.value);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(k+1);if(e.key==='ArrowLeft')show(k-1);if(e.key===' ')document.getElementById('p').click()});
setInterval(()=>{if(on)show(k+1)},250);show(0);</script>
